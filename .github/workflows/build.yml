name: OpenGuard Windows C++20 CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Installer (MSVC 2022 / Windows 2022)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Integrar vcpkg
        run: |
          vcpkg integrate install

      - name: Configurar CMake y generar solucion Visual Studio
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_TESTING=ON

      - name: Compilar binarios (Release)
        run: |
          cmd /c "cmake --build build --config Release --parallel > build.log 2>&1"
          $compileExit = $LASTEXITCODE
          if ($compileExit -ne 0) { exit $compileExit }

      - name: Publicar log de compilacion en rama ci-logs
        if: always() && github.event_name != 'pull_request'
        run: |
          if (Test-Path build.log) {
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git checkout -B ci-logs
            git add build.log -f
            git commit -m "ci: build log for run ${{ github.run_id }}"
            git push origin ci-logs -f
          }

      - name: Ejecutar pruebas unitarias automatizadas (Google Test)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Generar instalador (Inno Setup)
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -SkipBuild -SkipTests

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: OpenGuard-Installer
          path: |
            dist/OpenGuard_Setup_v*.exe
            dist/OpenGuard_Setup_v*.exe.sha256
          if-no-files-found: error

      - name: Adjuntar instalador a la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenGuard_Setup_v*.exe
            dist/OpenGuard_Setup_v*.exe.sha256
