name: OpenGuard Windows C++20 CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Installer (MSVC 2022 / Windows 2022)
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Comprobar que la etiqueta coincide con la version del codigo
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch '(?s)project\(\s*OpenGuard\s+VERSION\s+(\d+\.\d+\.\d+)') { throw "No se pudo leer la version de CMakeLists.txt" }
          if ($Matches[1] -ne $tag) { throw "La etiqueta v$tag no coincide con la version del codigo ($($Matches[1])). Suba la version en CMakeLists.txt, installer.iss, main_cli.cpp, main_gui.cpp, el .rc y el .manifest antes de crear la etiqueta." }

      - name: Integrar vcpkg
        run: |
          vcpkg integrate install

      - name: Configurar CMake y generar solucion Visual Studio
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_TESTING=ON

      - name: Compilar binarios (Release)
        run: |
          cmd /c "cmake --build build --config Release --parallel > build.log 2>&1"
          $compileExit = $LASTEXITCODE
          if ($compileExit -ne 0) { exit $compileExit }

      - name: Publicar log de compilacion en rama ci-logs
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true   # el log es solo una ayuda de diagnostico: nunca debe tumbar la compilacion
        run: |
          if (Test-Path build.log) {
            # Repositorio aparte solo con build.log: la rama ci-logs no contiene .github/workflows, asi que
            # GitHub no exige el permiso "workflows" al publicarla.
            $tmp = Join-Path $env:RUNNER_TEMP 'cilogs'
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Copy-Item build.log (Join-Path $tmp 'build.log') -Force
            Push-Location $tmp
            git init -q
            git checkout -q -b ci-logs
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add build.log
            git commit -q -m "ci: build log for run ${{ github.run_id }}"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
            Pop-Location
          }

      - name: Ejecutar pruebas unitarias automatizadas (Google Test)
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Instalar Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Generar instalador (Inno Setup)
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1 -SkipBuild -SkipTests

      - name: Firmar el instalador (solo si hay certificado configurado)
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CERT_PFX_BASE64)) {
            Write-Host "Sin certificado (secreto WINDOWS_CERT_PFX_BASE64): el instalador se publica SIN firma."
            exit 0
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "No se encontro signtool.exe" }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          try {
            foreach ($setup in Get-ChildItem dist\OpenGuard_Setup_v*.exe) {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 /d "OpenGuard Antivirus" $setup.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool sign fallo" }
              & $signtool.FullName verify /pa $setup.FullName
              if ($LASTEXITCODE -ne 0) { throw "La firma no se pudo verificar" }
              # El hash cambia al firmar: se regenera el .sha256
              $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"
              Write-Host "Firmado: $($setup.Name) SHA-256 $hash"
            }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Crear version portatil (.zip)
        run: |
          # Mismo contenido que el instalador pero sin instalar nada: se descomprime y se ejecuta openguard_gui.exe.
          $zip = "dist\OpenGuard_Portable.zip"
          $pack = "dist\portable\OpenGuard"
          Remove-Item $zip, "dist\portable" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item "dist\stage\*.exe" $pack
          Copy-Item "signatures" "$pack\signatures" -Recurse
          Copy-Item README.md, LICENSE, PRIVACY.md $pack
          Set-Content -Encoding utf8 "$pack\LEEME_PORTATIL.txt" @(
            "OpenGuard Antivirus - version portatil",
            "",
            "1. Descomprima esta carpeta en un lugar fijo (por ejemplo C:\OpenGuard). No la ejecute desde dentro del .zip.",
            "2. Ejecute openguard_gui.exe (pide permisos de administrador).",
            "3. Para la proteccion en tiempo real use Configuracion > Activar proteccion.",
            "",
            "Si Windows muestra 'Windows protegio su PC': Mas informacion > Ejecutar de todas formas.",
            "Para instalarlo con servicio, inicio automatico y desinstalador use el instalador OpenGuard_Setup."
          )
          Compress-Archive -Path "dist\portable\OpenGuard" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenGuard_Portable.zip" | Set-Content -Encoding ascii "$zip.sha256"
          Write-Host "Portatil: $zip SHA-256 $hash"

      - name: Crear zip del instalador
        run: |
          # El mismo instalador dentro de un .zip con nombre fijo: muchos navegadores bloquean menos un .zip que un .exe suelto.
          $setup = Get-ChildItem dist\OpenGuard_Setup_v*.exe | Select-Object -First 1
          $zip = "dist\OpenGuard_Instalador.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $setup.FullName -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  OpenGuard_Instalador.zip" | Set-Content -Encoding ascii "$zip.sha256"
          Write-Host "Instalador en zip: $zip SHA-256 $hash"

      - name: Crear paquete MSIX (experimental, sin firmar)
        continue-on-error: true   # experimental: si falla no debe impedir publicar el instalador
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch '(?s)project\(\s*OpenGuard\s+VERSION\s+(\d+\.\d+\.\d+)') { throw "No se pudo leer la version" }
          $ver = $Matches[1]
          $layout = "dist\msix_layout"
          Remove-Item $layout -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$layout\Assets" | Out-Null
          Copy-Item "dist\stage\*.exe" $layout
          Copy-Item "signatures" "$layout\signatures" -Recurse
          Copy-Item LICENSE, PRIVACY.md, README.md $layout

          # Iconos del paquete a partir de assets\logo.png (cuadrado, fondo transparente)
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "assets\logo.png"))
          foreach ($t in @(@{n='Square44x44Logo';w=44;h=44}, @{n='Square150x150Logo';w=150;h=150}, @{n='StoreLogo';w=50;h=50})) {
            $bmp = New-Object System.Drawing.Bitmap $t.w, $t.h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
            $g.Clear([System.Drawing.Color]::Transparent)
            $scale = [Math]::Min($t.w / $src.Width, $t.h / $src.Height)
            $dw = [int]($src.Width * $scale); $dh = [int]($src.Height * $scale)
            $g.DrawImage($src, [int](($t.w - $dw) / 2), [int](($t.h - $dh) / 2), $dw, $dh)
            $bmp.Save((Join-Path (Resolve-Path "$layout\Assets") "$($t.n).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $src.Dispose()

          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"
                   IgnorableNamespaces="uap rescap">
            <Identity Name="WilliamsAlexis.OpenGuard" Publisher="CN=WilliamsAlexis" Version="$ver.0" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>OpenGuard Antivirus</DisplayName>
              <PublisherDisplayName>Alexis Williams</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Resources>
              <Resource Language="es-mx" />
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="OpenGuard" Executable="openguard_gui.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="OpenGuard Antivirus" Description="Antivirus gratuito y de codigo abierto para Windows"
                                    BackgroundColor="#0B1220" Square150x150Logo="Assets\Square150x150Logo.png" Square44x44Logo="Assets\Square44x44Logo.png" />
              </Application>
            </Applications>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
              <rescap:Capability Name="allowElevation" />
            </Capabilities>
          </Package>
          "@
          Set-Content -Path "$layout\AppxManifest.xml" -Value $manifest -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw "No se encontro makeappx.exe" }
          $out = "dist\OpenGuard_v$ver.msix"
          & $makeappx.FullName pack /d $layout /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx fallo" }
          Write-Host "MSIX: $out ($([math]::Round((Get-Item $out).Length / 1MB, 2)) MB)"

      - name: Publicar paquete MSIX como artefacto (experimental)
        uses: actions/upload-artifact@v5
        with:
          name: OpenGuard-MSIX-experimental
          path: dist/OpenGuard_v*.msix
          if-no-files-found: warn

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: OpenGuard-Installer
          path: |
            dist/OpenGuard_Setup_v*.exe
            dist/OpenGuard_Setup_v*.exe.sha256
            dist/OpenGuard_Instalador.zip
            dist/OpenGuard_Instalador.zip.sha256
            dist/OpenGuard_Portable.zip
            dist/OpenGuard_Portable.zip.sha256
          if-no-files-found: error

      - name: Adjuntar instalador a la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenGuard_Setup_v*.exe
            dist/OpenGuard_Setup_v*.exe.sha256
            dist/OpenGuard_Instalador.zip
            dist/OpenGuard_Instalador.zip.sha256
            dist/OpenGuard_Portable.zip
            dist/OpenGuard_Portable.zip.sha256
